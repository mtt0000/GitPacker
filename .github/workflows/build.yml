name: Android Build

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Publish Release APK
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        SAFE_BRANCH_NAME=${BRANCH_NAME//\//-}
        TAG_NAME="latest-${SAFE_BRANCH_NAME}"

        # Move or create the tag locally
        git tag -f "$TAG_NAME"
        git push -f origin "$TAG_NAME"

        # Try to delete the old release if it exists, otherwise ignore the error
        gh release delete "$TAG_NAME" --yes || true

        # Create a new release and upload the APK
        gh release create "$TAG_NAME" \
          app/build/outputs/apk/release/app-release.apk \
          --title "Latest APK for $BRANCH_NAME" \
          --notes "Auto-generated release for branch $BRANCH_NAME at commit $GITHUB_SHA" \
          --prerelease
