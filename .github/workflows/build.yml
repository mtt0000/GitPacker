name: Android Build

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Shared key synced by mtt0000/shared-workflows.
    - name: Signing setup
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
        else
          echo "::warning::No KEYSTORE_BASE64 secret set, signing with the debug key."
        fi

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Publish Release APK
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        SAFE_BRANCH_NAME=${BRANCH_NAME//\//-}
        TAG_NAME="latest-${SAFE_BRANCH_NAME}"

        # Move or create the tag locally
        git tag -f "$TAG_NAME"
        git push -f origin "$TAG_NAME"

        # Try to delete the old release if it exists, otherwise ignore the error
        gh release delete "$TAG_NAME" --yes || true

        # Create a new release and upload the APK
        gh release create "$TAG_NAME" \
          app/build/outputs/apk/release/app-release.apk \
          --title "Latest APK for $BRANCH_NAME" \
          --notes "Auto-generated release for branch $BRANCH_NAME at commit $GITHUB_SHA" \
          --prerelease
